name: Signed macOS Package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build
        required: true
        default: main
        type: string
      rid:
        description: macOS runtime
        required: true
        default: osx-arm64
        type: choice
        options:
          - osx-arm64
          - osx-x64
      release_version:
        description: Version written to Info.plist, for example 1.0.0-preview.1
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  sign-notarize:
    name: ${{ inputs.rid }}
    runs-on: macos-latest
    steps:
      - name: Validate release credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_P12 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_DEVELOPER_ID_IDENTITY \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is missing: $name" >&2
              exit 78
            fi
          done

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Toren.App/Toren.App.csproj \
            --configuration Release \
            --runtime "${{ inputs.rid }}" \
            --self-contained true \
            -p:UseAppHost=true \
            --output "artifacts/publish/${{ inputs.rid }}"

      - name: Build macOS app bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          PUBLISH_DIR="artifacts/publish/${{ inputs.rid }}"
          APP_DIR="artifacts/bundle/Toren IDE.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"
          RESOURCES_DIR="$APP_DIR/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"
          cp -R "$PUBLISH_DIR"/. "$MACOS_DIR"/
          chmod +x "$MACOS_DIR/Toren.App"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Toren.App</string>
            <key>CFBundleIdentifier</key>
            <string>dev.toren.ide</string>
            <key>CFBundleName</key>
            <string>Toren IDE</string>
            <key>CFBundleDisplayName</key>
            <string>Toren IDE</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$RELEASE_VERSION</string>
            <key>CFBundleVersion</key>
            <string>$GITHUB_RUN_NUMBER</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/toren-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Configure notary credentials
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          xcrun notarytool store-credentials toren-notary \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

      - name: Sign, notarize, staple and verify
        shell: bash
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign-notarize-macos.sh
          scripts/sign-notarize-macos.sh \
            "artifacts/bundle/Toren IDE.app" \
            "$APPLE_DEVELOPER_ID_IDENTITY" \
            toren-notary

      - name: Create checksum
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="artifacts/bundle/Toren IDE.zip"
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: Toren-IDE-${{ inputs.rid }}-signed
          path: |
            artifacts/bundle/Toren IDE.zip
            artifacts/bundle/Toren IDE.zip.sha256
          if-no-files-found: error
