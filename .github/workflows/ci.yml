name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Toren.slnx

      - name: Build
        run: dotnet build Toren.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Toren.slnx --configuration Release --no-build --verbosity normal

      - name: xUnit compatibility
        run: dotnet test .github/test-fixtures/xunit-vstest/XunitFixture.csproj --configuration Release --verbosity minimal

      - name: MSTest compatibility
        run: dotnet test .github/test-fixtures/mstest-vstest/MSTestFixture.csproj --configuration Release --verbosity minimal

      - name: Microsoft Testing Platform structured discovery
        working-directory: .github/test-fixtures/mstest-mtp
        run: dotnet test --project MtpFixture.csproj --configuration Release --no-ansi --no-progress -- --list-tests json

      - name: Microsoft Testing Platform compatibility
        working-directory: .github/test-fixtures/mstest-mtp
        run: dotnet test --project MtpFixture.csproj --configuration Release --no-ansi --no-progress
