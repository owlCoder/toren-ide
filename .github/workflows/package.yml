name: Package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional version for the release-candidate manifest
        required: false
        type: string
      release_channel:
        description: Release channel used with release_version
        required: false
        default: preview
        type: choice
        options:
          - preview
          - stable
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - .github/workflows/package.yml
      - scripts/create-release-manifest.ps1

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish src/Toren.App/Toren.App.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            -p:UseAppHost=true `
            --output "artifacts/publish/${{ matrix.rid }}"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/publish/${{ matrix.rid }}/Toren.App.exe")) {
            throw "Published Windows executable was not found."
          }

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/package | Out-Null
          Compress-Archive `
            -Path "artifacts/publish/${{ matrix.rid }}/*" `
            -DestinationPath "artifacts/package/Toren-IDE-${{ matrix.rid }}.zip" `
            -CompressionLevel Optimal

      - name: Verify and package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -x "artifacts/publish/${{ matrix.rid }}/Toren.App"
          mkdir -p artifacts/package
          tar -C "artifacts/publish/${{ matrix.rid }}" -czf \
            "artifacts/package/Toren-IDE-${{ matrix.rid }}.tar.gz" .

      - name: Build unsigned macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="artifacts/publish/${{ matrix.rid }}"
          APP_DIR="artifacts/bundle/${{ matrix.rid }}/Toren IDE.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"
          RESOURCES_DIR="$APP_DIR/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR" artifacts/package
          cp -R "$PUBLISH_DIR"/. "$MACOS_DIR"/
          chmod +x "$MACOS_DIR/Toren.App"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            SHORT_VERSION="${GITHUB_REF_NAME#v}"
            BUILD_VERSION="$SHORT_VERSION"
          else
            SHORT_VERSION="0.0.0-preview"
            BUILD_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Toren.App</string>
            <key>CFBundleIdentifier</key>
            <string>dev.toren.ide</string>
            <key>CFBundleName</key>
            <string>Toren IDE</string>
            <key>CFBundleDisplayName</key>
            <string>Toren IDE</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$SHORT_VERSION</string>
            <key>CFBundleVersion</key>
            <string>$BUILD_VERSION</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP_DIR/Contents/Info.plist"
          test -x "$MACOS_DIR/Toren.App"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_DIR" "artifacts/package/Toren-IDE-${{ matrix.rid }}.zip"

      - name: Create checksum
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/package -File | Select-Object -First 1
          if ($null -eq $package) { throw "Package artifact was not created." }
          $hash = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -NoNewline "$($package.FullName).sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toren-IDE-${{ matrix.rid }}
          path: artifacts/package/*
          if-no-files-found: error

  release-manifest:
    name: release-candidate-manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Toren-IDE-*
          path: artifacts/download

      - name: Resolve release identity
        shell: pwsh
        run: |
          $refType = '${{ github.ref_type }}'
          $refName = '${{ github.ref_name }}'
          $inputVersion = '${{ inputs.release_version }}'
          $inputChannel = '${{ inputs.release_channel }}'

          if ($refType -eq 'tag') {
            if ($refName -match '^v(?<version>\d+\.\d+\.\d+)$') {
              $version = $Matches['version']
              $channel = 'stable'
            }
            elseif ($refName -match '^v(?<version>\d+\.\d+\.\d+-preview\.\d+)$') {
              $version = $Matches['version']
              $channel = 'preview'
            }
            else {
              throw "Unsupported release tag '$refName'."
            }
          }
          elseif (-not [string]::IsNullOrWhiteSpace($inputVersion)) {
            $version = $inputVersion
            $channel = if ([string]::IsNullOrWhiteSpace($inputChannel)) { 'preview' } else { $inputChannel }
          }
          else {
            $version = "0.0.0-preview.${{ github.run_number }}"
            $channel = 'preview'
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and verify release-candidate manifest
        shell: pwsh
        run: |
          ./scripts/create-release-manifest.ps1 `
            -ArtifactsRoot artifacts/download `
            -Version $env:RELEASE_VERSION `
            -Channel $env:RELEASE_CHANNEL `
            -OutputPath artifacts/release/Toren-IDE-release-manifest.json

      - name: Upload release-candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: Toren-IDE-release-manifest
          path: artifacts/release/Toren-IDE-release-manifest.json
          if-no-files-found: error
